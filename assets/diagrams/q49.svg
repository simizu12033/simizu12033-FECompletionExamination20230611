<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" role="img" aria-labelledby="t49 d49"><title id="t49">問49 M&amp;Aによる垂直統合の図解</title><desc id="d49">供給網の上流・下流を取り込むのが垂直統合</desc><defs><marker id="a492563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a49087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a49b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a495c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a49e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="690" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問49  M&amp;Aによる垂直統合</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">供給網の上流・下流を取り込むのが垂直統合</text><text x="400" y="133" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">原材料 → 製造 → 流通</text><rect x="35" y="195" width="275" height="115" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="172.5" y="244.45" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">鉄鉱石採掘会社</text><text x="172.5" y="279.45" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">原材料を供給</text><rect x="490" y="195" width="275" height="115" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="627.5" y="244.45" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">製鉄会社</text><text x="627.5" y="279.45" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">原材料を加工</text><line x1="310" y1="235" x2="490" y2="235" stroke="#087f68" stroke-width="4" marker-end="url(#a49087f68)" /><text x="400" y="217" font-size="22" fill="#087f68" text-anchor="middle" font-weight="400">供給</text><line x1="490" y1="285" x2="310" y2="285" stroke="#2563a6" stroke-width="3" marker-end="url(#a492563a6)" /><text x="400" y="344" font-size="25" fill="#2563a6" text-anchor="middle" font-weight="400">製鉄会社が上流企業を買収</text><rect x="85" y="425" width="630" height="105" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="470.05" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">同じ生産段階の企業同士＝水平統合</text><text x="400.0" y="501.05" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">関連の薄い別事業へ広がる＝コングロマリット型</text><rect x="24" y="621" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="654.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">原材料を供給する鉄鉱石採掘会社の買収＝垂直統合（ウ）</text></g></svg>