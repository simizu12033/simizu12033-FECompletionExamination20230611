<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="t12 d12"><title id="t12">問12 MTBFとMTTRの図解</title><desc id="d12">「故障までの時間」と「修復の時間」を、時間軸で分ける</desc><defs><marker id="a122563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a12087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a12b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a125c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a12e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="620" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問12  MTBFとMTTR</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">「故障までの時間」と「修復の時間」を、時間軸で分ける</text><text x="45" y="120" font-size="23" fill="#16324f" text-anchor="start" font-weight="400">例：稼働90時間 → 修復10時間 → 再稼働</text><rect x="55" y="175" width="600" height="100" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><rect x="655" y="175" width="75" height="100" rx="10" fill="#fbe8eb" stroke="#b33b44" stroke-width="2"/><text x="355" y="232" font-size="27" fill="#087f68" text-anchor="middle" font-weight="400">稼働：MTBF＝90時間</text><text x="693" y="315" font-size="21" fill="#b33b44" text-anchor="middle" font-weight="400">修復</text><line x1="655" y1="335" x2="730" y2="335" stroke="#b33b44" stroke-width="3" /><text x="693" y="371" font-size="20" fill="#b33b44" text-anchor="middle" font-weight="400">MTTR＝10</text><line x1="55" y1="285" x2="655" y2="285" stroke="#087f68" stroke-width="3" /><text x="355" y="328" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">予防保守 → 故障までの間隔を延ばす</text><rect x="70" y="415" width="660" height="90" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="451.95" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">稼働率＝90 ÷ (90＋10)</text><text x="400.0" y="486.95" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">＝90%</text><rect x="24" y="551" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="584.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">予防保守で故障しにくくなる → MTBFが長くなる（エ）</text></g></svg>