<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 740" role="img" aria-labelledby="t54 d54"><title id="t54">問54 制約下の最大利益の図解</title><desc id="d54">工場の制約は12000分。1個の利益ではなく、1分の利益で優先</desc><defs><marker id="a542563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a54087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a54b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a545c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a54e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="740" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問54  制約下の最大利益</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">工場の制約は12000分。1個の利益ではなく、1分の利益で優先</text><text x="40" y="172" font-size="28" fill="#16324f" text-anchor="start" font-weight="700">X</text><rect x="100" y="140" width="450.0" height="45" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="570.0" y="172" font-size="22" fill="#087f68" text-anchor="start" font-weight="400">1800÷6＝300円/分</text><text x="40" y="252" font-size="28" fill="#16324f" text-anchor="start" font-weight="700">Y</text><rect x="100" y="220" width="375.0" height="45" rx="10" fill="#edf4fb" stroke="#2563a6" stroke-width="2"/><text x="495.0" y="252" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">2500÷10＝250円/分</text><text x="40" y="332" font-size="28" fill="#16324f" text-anchor="start" font-weight="700">Z</text><rect x="100" y="300" width="300.0" height="45" rx="10" fill="#edf4fb" stroke="#2563a6" stroke-width="2"/><text x="420.0" y="332" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">3000÷15＝200円/分</text><text x="40" y="412" font-size="25" fill="#16324f" text-anchor="start" font-weight="700">200時間＝12000分の使い方</text><rect x="50" y="445" width="350" height="95" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="225.0" y="484.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">X：1000個（需要上限）</text><text x="225.0" y="516.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">6000分／180万円</text><rect x="400" y="445" width="350" height="95" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="575.0" y="484.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">Y：600個</text><text x="575.0" y="516.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">残り6000分／150万円</text><text x="400" y="597" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">需要上限を守り、効率の高い製品から作る</text><rect x="24" y="671" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="704.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">180万円＋150万円＝最大330万円（エ）</text></g></svg>