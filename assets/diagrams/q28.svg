<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-labelledby="t28 d28"><title id="t28">問28 共通鍵暗号と公開鍵暗号の図解</title><desc id="d28">共通鍵は同じ鍵、公開鍵方式は対になる別の鍵を使う</desc><defs><marker id="a282563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a28087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a28b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a285c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a28e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="700" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問28  共通鍵暗号と公開鍵暗号</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">共通鍵は同じ鍵、公開鍵方式は対になる別の鍵を使う</text><text x="25" y="125" font-size="25" fill="#16324f" text-anchor="start" font-weight="700">共通鍵暗号（AESなど）</text><rect x="35" y="155" width="180" height="85" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="125.0" y="189.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">送信者</text><text x="125.0" y="221.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">鍵Kで暗号化</text><rect x="585" y="155" width="180" height="85" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="675.0" y="190.05" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">受信者</text><text x="675.0" y="221.05" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">同じ鍵Kで復号</text><line x1="215" y1="198" x2="585" y2="198" stroke="#2563a6" stroke-width="3" marker-end="url(#a282563a6)" /><rect x="300" y="170" width="200" height="56" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="207.1" font-size="26" fill="#16324f" text-anchor="middle" font-weight="400">暗号文</text><text x="400" y="280" font-size="24" fill="#087f68" text-anchor="middle" font-weight="400">送受信者が同じ秘密の鍵Kを共有</text><text x="25" y="352" font-size="25" fill="#16324f" text-anchor="start" font-weight="700">公開鍵暗号（RSAなど）</text><rect x="35" y="390" width="250" height="115" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="160.0" y="424.55" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">送信者</text><text x="160.0" y="455.55" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">受信者の公開鍵</text><text x="160.0" y="486.55" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">で暗号化</text><rect x="520" y="390" width="245" height="115" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="642.5" y="440.05" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">受信者</text><text x="642.5" y="471.05" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">自分の秘密鍵で復号</text><line x1="285" y1="438" x2="520" y2="438" stroke="#2563a6" stroke-width="3" marker-end="url(#a282563a6)" /><text x="400" y="423" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">暗号文</text><text x="400" y="539" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">公開鍵は渡せる／秘密鍵は受信者だけが保持</text><rect x="24" y="631" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="664.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">共通鍵暗号では暗号化・復号に同じ鍵を使う（イ）</text></g></svg>