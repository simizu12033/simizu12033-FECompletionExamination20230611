<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="t32 d32"><title id="t32">問32 VDIの図解</title><desc id="d32">アプリとデータはサーバ側。端末へは画面、逆方向へは操作</desc><defs><marker id="a322563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a32087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a32b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a325c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a32e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="620" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問32  VDI</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">アプリとデータはサーバ側。端末へは画面、逆方向へは操作</text><rect x="25" y="125" width="355" height="330" rx="10" fill="#edf4fb" stroke="#2563a6" stroke-width="2"/><text x="202" y="166" font-size="27" fill="#2563a6" text-anchor="middle" font-weight="400">サーバ側</text><rect x="60" y="210" width="285" height="175" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="202.5" y="256.75" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">仮想デスクトップ</text><text x="202.5" y="289.75" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">アプリを実行</text><text x="202.5" y="322.75" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">データを保存</text><text x="202.5" y="355.75" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">Webへアクセス</text><rect x="540" y="125" width="235" height="330" rx="10" fill="#f1fbf7" stroke="#087f68" stroke-width="2"/><text x="657" y="166" font-size="26" fill="#087f68" text-anchor="middle" font-weight="400">利用者端末</text><rect x="575" y="235" width="165" height="100" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="657.5" y="277.55" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">画面を表示</text><text x="657.5" y="308.55" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">キー・マウス</text><line x1="380" y1="250" x2="540" y2="250" stroke="#087f68" stroke-width="4" marker-end="url(#a32087f68)" /><text x="460" y="220" font-size="21" fill="#087f68" text-anchor="middle" font-weight="400">画面データ</text><line x1="540" y1="370" x2="380" y2="370" stroke="#2563a6" stroke-width="3" marker-end="url(#a322563a6)" /><text x="460" y="413" font-size="21" fill="#2563a6" text-anchor="middle" font-weight="400">操作情報</text><text x="400" y="505" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">端末へ実行ファイルや処理データを送る方式ではない</text><rect x="24" y="551" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="584.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">サーバで処理し、生成したデスクトップ画面を端末へ送る（ウ）</text></g></svg>