<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="t7 d7"><title id="t7">問7 再入可能なプログラムの図解</title><desc id="d7">別タスクからの呼出しが重なっても、作業データを混ぜない</desc><defs><marker id="a72563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a7087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a7b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a75c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a7e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="620" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問7  再入可能なプログラム</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">別タスクからの呼出しが重なっても、作業データを混ぜない</text><rect x="35" y="125" width="230" height="80" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="150.0" y="157.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">タスクA</text><text x="150.0" y="190.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">先に呼び出す</text><rect x="35" y="355" width="230" height="80" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="150.0" y="387.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">タスクB</text><text x="150.0" y="420.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">実行中に呼び出す</text><rect x="340" y="125" width="230" height="310" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="455.0" y="271.95" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">同じプログラム</text><text x="455.0" y="306.95" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">命令を共有</text><line x1="265" y1="165" x2="340" y2="165" stroke="#2563a6" stroke-width="3" marker-end="url(#a72563a6)" /><line x1="265" y1="395" x2="340" y2="395" stroke="#2563a6" stroke-width="3" marker-end="url(#a72563a6)" /><rect x="620" y="125" width="145" height="115" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="692.5" y="175.2" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">A専用の</text><text x="692.5" y="205.2" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">作業領域</text><rect x="620" y="320" width="145" height="115" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="692.5" y="370.2" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">B専用の</text><text x="692.5" y="400.2" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">作業領域</text><line x1="570" y1="185" x2="620" y2="185" stroke="#087f68" stroke-width="3" marker-end="url(#a7087f68)" /><line x1="570" y1="375" x2="620" y2="375" stroke="#087f68" stroke-width="3" marker-end="url(#a7087f68)" /><text x="400" y="497" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">命令は共通でも、各呼出しの状態は独立</text><rect x="24" y="551" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="584.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">実行中に再度呼び出されても正しく動く＝再入可能（ウ）</text></g></svg>