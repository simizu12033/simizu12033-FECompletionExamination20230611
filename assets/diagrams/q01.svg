<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="t1 d1"><title id="t1">問1 情報落ちの図解</title><desc id="d1">仮数を4桁だけ保持する例：小さい数はどこへ消える？</desc><defs><marker id="a12563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a1087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a1b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a15c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a1e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="620" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問1  情報落ち</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">仮数を4桁だけ保持する例：小さい数はどこへ消える？</text><rect x="40" y="110" width="330" height="80" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="205.0" y="142.4" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">大きい数</text><text x="205.0" y="174.4" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">1.234 × 10⁶</text><rect x="430" y="110" width="330" height="80" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="595.0" y="142.4" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">小さい数</text><text x="595.0" y="174.4" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">1.000 × 10⁰</text><line x1="595" y1="190" x2="595" y2="240" stroke="#2563a6" stroke-width="3" marker-end="url(#a12563a6)" /><text x="430" y="224" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">指数を10⁶にそろえる</text><rect x="70" y="250" width="660" height="70" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="295.5" font-size="30" fill="#16324f" text-anchor="middle" font-weight="400">1.234000 ＋ 0.000001</text><text x="88" y="362" font-size="21" fill="#2563a6" text-anchor="start" font-weight="400">保持する4桁</text><text x="435" y="362" font-size="21" fill="#b33b44" text-anchor="start" font-weight="400">保持桁の外 → 切り捨てられる</text><rect x="160" y="385" width="190" height="60" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><rect x="350" y="385" width="270" height="60" rx="10" fill="#fbe8eb" stroke="#b33b44" stroke-width="2"/><text x="255" y="425" font-size="30" fill="#16324f" text-anchor="middle" font-weight="400">1 . 2 3 4</text><text x="485" y="425" font-size="30" fill="#b33b44" text-anchor="middle" font-weight="400">0 0 1</text><text x="400" y="492" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">小さい数を足しても、保存された値は 1.234 × 10⁶</text><rect x="24" y="520" width="752" height="82" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="553.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">大小差が大きい加減算で、小さい数の寄与が失われる＝情報落ち（ウ</text><text x="400.0" y="584.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">）</text></g></svg>