<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="t46 d46"><title id="t46">問46 エンタープライズアーキテクチャの図解</title><desc id="d46">現状から目標へ：To-Beは「将来あるべき姿」</desc><defs><marker id="a462563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a46087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a46b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a465c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a46e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="620" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問46  エンタープライズアーキテクチャ</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">現状から目標へ：To-Beは「将来あるべき姿」</text><rect x="30" y="135" width="295" height="280" rx="10" fill="#fbe8eb" stroke="#b7c9dc" stroke-width="2"/><text x="177.5" y="234.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">As-Is：現状</text><text x="177.5" y="267.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">部署ごとに別の情報</text><text x="177.5" y="300.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">重複入力</text><text x="177.5" y="333.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">手作業が多い</text><rect x="475" y="135" width="295" height="280" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="622.5" y="234.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">To-Be：目標</text><text x="622.5" y="267.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">情報を連携</text><text x="622.5" y="300.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">入力を一度に</text><text x="622.5" y="333.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">業務を効率化</text><line x1="325" y1="275" x2="475" y2="275" stroke="#087f68" stroke-width="4" marker-end="url(#a46087f68)" /><text x="400" y="231" font-size="21" fill="#087f68" text-anchor="middle" font-weight="400">差を分析</text><rect x="150" y="465" width="500" height="70" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="508.75" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">ギャップを埋める移行計画を立てる</text><rect x="24" y="551" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="584.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">あるべき将来の業務・システムを表すモデル＝To-Be（イ）</text></g></svg>