<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="t47 d47"><title id="t47">問47 SaaSの図解</title><desc id="d47">利用者はアプリを使う。アプリと基盤の運用は提供者が担う</desc><defs><marker id="a472563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a47087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a47b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a475c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a47e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="620" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問47  SaaS</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">利用者はアプリを使う。アプリと基盤の運用は提供者が担う</text><rect x="30" y="165" width="230" height="160" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="145.0" y="220.75" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">利用者</text><text x="145.0" y="253.75" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">ブラウザなどで</text><text x="145.0" y="286.75" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">アプリを利用</text><rect x="425" y="120" width="345" height="350" rx="10" fill="#edf4fb" stroke="#2563a6" stroke-width="2"/><text x="597" y="157" font-size="25" fill="#2563a6" text-anchor="middle" font-weight="400">サービス提供者</text><rect x="455" y="185" width="285" height="65" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="597.5" y="225.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">アプリケーション</text><rect x="455" y="270" width="285" height="65" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="597.5" y="310.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">実行基盤・OS</text><rect x="455" y="355" width="285" height="65" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="597.5" y="395.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">サーバ・ネットワーク</text><line x1="260" y1="215" x2="455" y2="215" stroke="#087f68" stroke-width="4" marker-end="url(#a47087f68)" /><text x="350" y="176" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">ネットワーク</text><text x="400" y="515" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">メールや業務アプリの機能を、サービスとして利用</text><rect x="24" y="551" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="584.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">ソフトウェアの機能をネットワーク経由で提供する＝SaaS（ア）</text></g></svg>