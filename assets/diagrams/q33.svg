<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-labelledby="t33 d33"><title id="t33">問33 Web攻撃と対策の図解</title><desc id="d33">入力を「命令の一部」にせず、「値」として渡す</desc><defs><marker id="a332563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a33087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a33b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a335c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a33e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="700" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問33  Web攻撃と対策</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">入力を「命令の一部」にせず、「値」として渡す</text><text x="25" y="120" font-size="24" fill="#b33b44" text-anchor="start" font-weight="700">危険：SQL文字列へ入力を連結</text><rect x="30" y="150" width="500" height="80" rx="10" fill="#fbe8eb" stroke="#b7c9dc" stroke-width="2"/><text x="280.0" y="198.4" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">SELECT … WHERE name = &#x27;入力&#x27;</text><rect x="570" y="150" width="205" height="80" rx="10" fill="#fbe8eb" stroke="#b7c9dc" stroke-width="2"/><text x="672.5" y="182.7" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">入力にSQL命令が</text><text x="672.5" y="212.7" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">混ざり得る</text><line x1="530" y1="190" x2="570" y2="190" stroke="#b33b44" stroke-width="3" marker-end="url(#a33b33b44)" /><text x="25" y="310" font-size="24" fill="#087f68" text-anchor="start" font-weight="700">対策：SQLの形を固定する</text><rect x="30" y="350" width="735" height="75" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="397.5" y="396.95" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">SELECT … WHERE name = ?</text><rect x="70" y="470" width="220" height="70" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="180.0" y="514.1" font-size="26" fill="#16324f" text-anchor="middle" font-weight="400">入力データ</text><line x1="290" y1="505" x2="520" y2="425" stroke="#087f68" stroke-width="4" marker-end="url(#a33087f68)" /><text x="450" y="526" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">「?」へパラメータとして渡す</text><text x="400" y="569" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">SQLの構造は変わらず、値だけが変わる</text><rect x="24" y="631" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="664.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">プレースホルダでSQL命令と入力データを分離する（ア）</text></g></svg>