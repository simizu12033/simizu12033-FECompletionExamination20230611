<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="t59 d59"><title id="t59">問59 売上原価の計算の図解</title><desc id="d59">「営業利益率10%」の分母は売上高。その売上高の80%が原価</desc><defs><marker id="a592563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a59087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a59b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a595c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a59e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="680" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問59  売上原価の計算</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">「営業利益率10%」の分母は売上高。その売上高の80%が原価</text><rect x="40" y="115" width="720" height="100" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="156.8" font-size="28" fill="#16324f" text-anchor="middle" font-weight="400">営業利益200万円 ÷ 10%</text><text x="400.0" y="192.8" font-size="28" fill="#16324f" text-anchor="middle" font-weight="400">＝ 売上高2000万円</text><text x="40" y="276" font-size="24" fill="#16324f" text-anchor="start" font-weight="700">売上高2000万円を割合で分ける</text><rect x="50" y="315" width="560" height="150" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="330.0" y="382.25" font-size="25" fill="#2563a6" text-anchor="middle" font-weight="400">売上原価80%</text><text x="330.0" y="415.25" font-size="25" fill="#2563a6" text-anchor="middle" font-weight="400">1600万円</text><rect x="610" y="315" width="70" height="150" rx="10" fill="#fff3df" stroke="#b7c9dc" stroke-width="2"/><text x="645.0" y="383.15" font-size="19" fill="#e89536" text-anchor="middle" font-weight="400">経費</text><text x="645.0" y="410.15" font-size="19" fill="#e89536" text-anchor="middle" font-weight="400">10%</text><rect x="680" y="315" width="70" height="150" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="715.0" y="369.65" font-size="19" fill="#087f68" text-anchor="middle" font-weight="400">営業</text><text x="715.0" y="396.65" font-size="19" fill="#087f68" text-anchor="middle" font-weight="400">利益</text><text x="715.0" y="423.65" font-size="19" fill="#087f68" text-anchor="middle" font-weight="400">10%</text><text x="400" y="519" font-size="28" fill="#087f68" text-anchor="middle" font-weight="400">原価＝2000万円 × 80%＝1600万円</text><text x="400" y="558" font-size="20" fill="#5c7185" text-anchor="middle" font-weight="400">経費10%は、この例の差額から求めた部分</text><rect x="24" y="611" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="644.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">営業利益に80%を掛けず、売上高に原価率を掛ける（イ）</text></g></svg>