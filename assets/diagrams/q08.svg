<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-labelledby="t8 d8"><title id="t8">問8 CPIと1秒当たりの命令数の図解</title><desc id="d8">1秒間の命令数を計算し、最後に「万命令」へ単位を変換</desc><defs><marker id="a82563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a8087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a8b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a85c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a8e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="700" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問8  CPIと1秒当たりの命令数</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">1秒間の命令数を計算し、最後に「万命令」へ単位を変換</text><rect x="40" y="125" width="720" height="90" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="180.15" font-size="29" fill="#16324f" text-anchor="middle" font-weight="400">1GHz＝1秒に10億クロック</text><line x1="400" y1="215" x2="400" y2="280" stroke="#087f68" stroke-width="3" marker-end="url(#a8087f68)" /><text x="440" y="261" font-size="23" fill="#087f68" text-anchor="start" font-weight="400">1命令に0.8クロック</text><rect x="40" y="285" width="720" height="100" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="326.95" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">10億クロック ÷ 0.8クロック/命令</text><text x="400.0" y="361.95" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">＝12億5000万命令/秒</text><line x1="400" y1="385" x2="400" y2="450" stroke="#087f68" stroke-width="3" marker-end="url(#a8087f68)" /><text x="440" y="430" font-size="24" fill="#087f68" text-anchor="start" font-weight="400">10000で割る</text><rect x="40" y="455" width="720" height="105" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="499.15" font-size="29" fill="#16324f" text-anchor="middle" font-weight="400">12億5000万 ÷ 10000</text><text x="400.0" y="536.15" font-size="29" fill="#16324f" text-anchor="middle" font-weight="400">＝125000万命令/秒</text><rect x="24" y="631" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="664.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">CPIで割って命令数にする。万単位への変換も忘れない（エ）</text></g></svg>