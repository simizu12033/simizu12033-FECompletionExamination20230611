<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="t48 d48"><title id="t48">問48 プライバシーバイデザインの図解</title><desc id="d48">個人情報の保護を、企画・設計からシステムへ埋め込む</desc><defs><marker id="a482563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a48087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a48b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a485c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a48e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="680" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問48  プライバシーバイデザイン</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">個人情報の保護を、企画・設計からシステムへ埋め込む</text><rect x="35" y="120" width="200" height="95" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="135.0" y="159.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">企画</text><text x="135.0" y="191.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">何が必要？</text><rect x="300" y="120" width="200" height="95" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="159.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">設計</text><text x="400.0" y="191.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">どう守る？</text><rect x="565" y="120" width="200" height="95" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="665.0" y="159.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">運用</text><text x="665.0" y="191.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">保護を維持</text><line x1="235" y1="168" x2="300" y2="168" stroke="#2563a6" stroke-width="3" marker-end="url(#a482563a6)" /><line x1="500" y1="168" x2="565" y2="168" stroke="#2563a6" stroke-width="3" marker-end="url(#a482563a6)" /><rect x="30" y="310" width="220" height="125" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="140.0" y="348.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">取得を最小限に</text><text x="140.0" y="380.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">不要な情報は</text><text x="140.0" y="412.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">集めない</text><rect x="290" y="310" width="220" height="125" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="349.55" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">利用範囲を限定</text><text x="400.0" y="380.55" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">権限・初期設定</text><text x="400.0" y="411.55" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">保存期間を決める</text><rect x="550" y="310" width="220" height="125" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="660.0" y="348.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">適切に削除</text><text x="660.0" y="380.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">確認・改善</text><text x="660.0" y="412.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">漏えいを防ぐ</text><line x1="140" y1="215" x2="140" y2="310" stroke="#087f68" stroke-width="3" marker-end="url(#a48087f68)" /><line x1="400" y1="215" x2="400" y2="310" stroke="#087f68" stroke-width="3" marker-end="url(#a48087f68)" /><line x1="665" y1="215" x2="660" y2="310" stroke="#087f68" stroke-width="3" marker-end="url(#a48087f68)" /><text x="400" y="523" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">完成してから対策を足すだけではなく、最初から組み込む</text><rect x="24" y="580" width="752" height="82" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="613.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">設計段階からプライバシー保護を実装＝プライバシーバイデザイン（</text><text x="400.0" y="644.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">ウ）</text></g></svg>