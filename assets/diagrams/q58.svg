array="7 5"/><line x1="500" y1="120" x2="500" y2="400" stroke="#5c7185" stroke-width="2" stroke-dasharray="7 5"/><text x="183" y="487" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">初期故障期</text><text x="183" y="527" font-size="21" fill="#087f68" text-anchor="middle" font-weight="400">初期不良が減る</text><text x="392" y="487" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">偶発故障期</text><text x="392" y="527" font-size="21" fill="#087f68" text-anchor="middle" font-weight="400">ほぼ一定</text><text x="615" y="487" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">摩耗故障期</text><text x="615" y="527" font-size="21" fill="#087f68" text-anchor="middle" font-weight="400">劣化で増える</text><rect x="24" y="611" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="644.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">初期は減少 → 低く一定 → 再び増加する曲線＝バスタブ曲線（ウ）</text></g></svg>