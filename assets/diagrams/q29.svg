ht="400">CAPTCHA</text><text x="427.5" y="306.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">人が解きやすい</text><text x="427.5" y="339.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">確認課題</text><line x1="235" y1="182" x2="310" y2="245" stroke="#087f68" stroke-width="3" marker-end="url(#a29087f68)" /><line x1="235" y1="397" x2="310" y2="349" stroke="#b33b44" stroke-width="3" marker-end="url(#a29b33b44)" /><rect x="620" y="140" width="150" height="85" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="695.0" y="191.95" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">受付へ</text><rect x="620" y="355" width="150" height="85" rx="10" fill="#fbe8eb" stroke="#b7c9dc" stroke-width="2"/><text x="695.0" y="390.05" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">自動投稿を</text><text x="695.0" y="421.05" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">抑える</text><line x1="545" y1="245" x2="620" y2="183" stroke="#087f68" stroke-width="3" marker-end="url(#a29087f68)" /><line x1="545" y1="350" x2="620" y2="398" stroke="#b33b44" stroke-width="3" marker-end="url(#a29b33b44)" /><text x="400" y="502" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">目的：機械的な大量投稿・アクセスの抑制</text><rect x="24" y="551" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="584.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">Webへのアクセスが人の操作かを確認する仕組み（ア）</text></g></svg>