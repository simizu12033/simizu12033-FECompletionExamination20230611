<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="t36 d36"><title id="t36">問36 ソフトウェアの使用性の図解</title><desc id="d36">利用者の「どう操作する？」を、その場のヘルプで解決する</desc><defs><marker id="a362563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a36087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a36b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a365c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a36e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="620" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問36  ソフトウェアの使用性</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">利用者の「どう操作する？」を、その場のヘルプで解決する</text><rect x="35" y="125" width="440" height="350" rx="10" fill="white" stroke="#2563a6" stroke-width="2"/><text x="65" y="170" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">ファイル登録</text><rect x="65" y="210" width="275" height="65" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="202.5" y="250.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">ファイルを選ぶ</text><rect x="355" y="210" width="80" height="65" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="395.0" y="252.3" font-size="28" fill="#16324f" text-anchor="middle" font-weight="400">？</text><rect x="65" y="340" width="370" height="85" rx="10" fill="#fbe8eb" stroke="#b7c9dc" stroke-width="2"/><text x="250.0" y="374.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">利用者：</text><text x="250.0" y="406.9" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">何を選べばよいか分からない</text><rect x="540" y="200" width="235" height="200" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="657.5" y="262.7" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">オンラインヘルプ</text><text x="657.5" y="292.7" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">①ファイルを選択</text><text x="657.5" y="322.7" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">②内容を確認</text><text x="657.5" y="352.7" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">③登録を押す</text><line x1="435" y1="242" x2="540" y2="242" stroke="#087f68" stroke-width="3" marker-end="url(#a36087f68)" /><text x="400" y="515" font-size="24" fill="#087f68" text-anchor="middle" font-weight="400">理解しやすい → 学びやすい → 操作しやすい</text><rect x="24" y="551" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="584.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">利用方法を説明するオンラインヘルプは使用性を高める（ア）</text></g></svg>