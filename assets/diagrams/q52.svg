<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-labelledby="t52 d52"><title id="t52">問52 ファウンドリ企業の図解</title><desc id="d52">工場を持つ受託製造側がファウンドリ。設計側のファブレスと区別</desc><defs><marker id="a522563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a52087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a52b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a525c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a52e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="700" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問52  ファウンドリ企業</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">工場を持つ受託製造側がファウンドリ。設計側のファブレスと区別</text><rect x="30" y="125" width="230" height="95" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="145.0" y="164.6" font-size="26" fill="#16324f" text-anchor="middle" font-weight="400">設計企業A</text><text x="145.0" y="198.6" font-size="26" fill="#16324f" text-anchor="middle" font-weight="400">製品を設計</text><line x1="145" y1="220" x2="400" y2="325" stroke="#087f68" stroke-width="3" marker-end="url(#a52087f68)" /><rect x="285" y="125" width="230" height="95" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="164.6" font-size="26" fill="#16324f" text-anchor="middle" font-weight="400">設計企業B</text><text x="400.0" y="198.6" font-size="26" fill="#16324f" text-anchor="middle" font-weight="400">製品を設計</text><line x1="400" y1="220" x2="400" y2="325" stroke="#087f68" stroke-width="3" marker-end="url(#a52087f68)" /><rect x="540" y="125" width="230" height="95" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="655.0" y="164.6" font-size="26" fill="#16324f" text-anchor="middle" font-weight="400">設計企業C</text><text x="655.0" y="198.6" font-size="26" fill="#16324f" text-anchor="middle" font-weight="400">製品を設計</text><line x1="655" y1="220" x2="400" y2="325" stroke="#087f68" stroke-width="3" marker-end="url(#a52087f68)" /><rect x="135" y="335" width="530" height="165" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="391.3" font-size="28" fill="#16324f" text-anchor="middle" font-weight="400">ファウンドリ企業</text><text x="400.0" y="427.3" font-size="28" fill="#16324f" text-anchor="middle" font-weight="400">自社の工場・製造設備で</text><text x="400.0" y="463.3" font-size="28" fill="#16324f" text-anchor="middle" font-weight="400">複数企業の生産を専門に受託</text><text x="400" y="557" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">ファブレス企業は工場を持たず、生産を外注する側</text><rect x="24" y="631" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="664.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">複数企業の製造を請け負う受託製造企業＝ファウンドリ（エ）</text></g></svg>