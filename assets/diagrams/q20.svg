<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="t20 d20"><title id="t20">問20 SQLのカーソルの図解</title><desc id="d20">問合せ結果を一行ずつ取り出す：カーソルの位置を進める</desc><defs><marker id="a202563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a20087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a20b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a205c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a20e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="620" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問20  SQLのカーソル</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">問合せ結果を一行ずつ取り出す：カーソルの位置を進める</text><rect x="35" y="125" width="245" height="80" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="157.5" y="157.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">SELECT の結果</text><text x="157.5" y="190.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">複数行の集合</text><rect x="35" y="240" width="245" height="62" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="157.5" y="279.75" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">101  佐藤</text><rect x="35" y="312" width="245" height="62" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="157.5" y="351.75" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">102  鈴木</text><rect x="35" y="384" width="245" height="62" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="157.5" y="423.75" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">103  田中</text><text x="395" y="305" font-size="22" fill="#087f68" text-anchor="start" font-weight="400">現在の行</text><rect x="515" y="270" width="250" height="120" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="640.0" y="307.7" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">FETCH</text><text x="640.0" y="337.7" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">この行を取得して</text><text x="640.0" y="367.7" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">プログラムで処理</text><line x1="280" y1="340" x2="515" y2="340" stroke="#2563a6" stroke-width="3" marker-end="url(#a202563a6)" /><line x1="400" y1="370" x2="400" y2="447" stroke="#087f68" stroke-width="3" marker-end="url(#a20087f68)" /><text x="445" y="440" font-size="21" fill="#087f68" text-anchor="start" font-weight="400">次のFETCHで次の行へ</text><rect x="24" y="551" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="584.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">結果集合内の位置を管理して、一行ずつ取得する＝CURSOR（ア）</text></g></svg>