<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" role="img" aria-labelledby="t11 d11"><title id="t11">問11 分散処理のアクセス透過性の図解</title><desc id="d11">遠隔の処理方式を知らなくても、手元の資源と同じ操作で使える</desc><defs><marker id="a112563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a11087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a11b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a115c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a11e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="690" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問11  分散処理のアクセス透過性</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">遠隔の処理方式を知らなくても、手元の資源と同じ操作で使える</text><rect x="255" y="115" width="290" height="85" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="167.3" font-size="28" fill="#16324f" text-anchor="middle" font-weight="400">利用者・アプリ</text><rect x="280" y="245" width="240" height="85" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="279.45" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">同じ操作</text><text x="400.0" y="314.45" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">読取り・書込み</text><line x1="400" y1="200" x2="400" y2="245" stroke="#087f68" stroke-width="3" marker-end="url(#a11087f68)" /><rect x="35" y="430" width="300" height="115" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="185.0" y="479.45" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">手元の資源</text><text x="185.0" y="514.45" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">ローカルのファイル</text><rect x="465" y="430" width="300" height="115" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="615.0" y="480.05" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">遠隔の資源</text><text x="615.0" y="511.05" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">ネットワーク先のファイル</text><line x1="340" y1="330" x2="185" y2="430" stroke="#087f68" stroke-width="3" marker-end="url(#a11087f68)" /><line x1="460" y1="330" x2="615" y2="430" stroke="#087f68" stroke-width="3" marker-end="url(#a11087f68)" /><text x="615" y="383" font-size="21" fill="#087f68" text-anchor="middle" font-weight="400">通信・方式の違いを吸収</text><rect x="24" y="621" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="654.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">利用者にアクセス方式の違いを意識させない＝アクセス透過性（ア）</text></g></svg>