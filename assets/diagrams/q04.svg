<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-labelledby="t4 d4"><title id="t4">問4 問題規模・演算速度と計算時間の図解</title><desc id="d4">未知数の個数の3乗に比例する計算時間。計算機の速度は4倍</desc><defs><marker id="a42563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a4087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a4b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a45c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a4e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="700" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問4  問題規模・演算速度と計算時間</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">未知数の個数の3乗に比例する計算時間。計算機の速度は4倍</text><rect x="45" y="125" width="710" height="95" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="182.3" font-size="28" fill="#16324f" text-anchor="middle" font-weight="400">基準：未知数100個 → 計算時間2秒</text><line x1="400" y1="220" x2="400" y2="285" stroke="#087f68" stroke-width="3" marker-end="url(#a4087f68)" /><text x="440" y="264" font-size="24" fill="#087f68" text-anchor="start" font-weight="400">未知数は10倍</text><rect x="45" y="290" width="710" height="115" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="339.45" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">未知数1000個：計算量は10³＝1000倍</text><text x="400.0" y="374.45" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">同じ計算機なら2秒 × 1000＝2000秒</text><line x1="400" y1="405" x2="400" y2="467" stroke="#087f68" stroke-width="3" marker-end="url(#a4087f68)" /><text x="440" y="449" font-size="24" fill="#087f68" text-anchor="start" font-weight="400">演算速度は4倍</text><rect x="45" y="475" width="710" height="100" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="516.8" font-size="28" fill="#16324f" text-anchor="middle" font-weight="400">新しい計算機：時間は1/4</text><text x="400.0" y="552.8" font-size="28" fill="#16324f" text-anchor="middle" font-weight="400">2000秒 ÷ 4＝500秒</text><rect x="24" y="631" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="664.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">問題サイズ10倍 → 計算量1000倍 → 速度4倍で500秒（ウ）</text></g></svg>