<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 770" role="img" aria-labelledby="t30 d30"><title id="t30">問30 リスクの回避の図解</title><desc id="d30">対応の違い：活動をやめる／影響を減らす／負担を移す／受け入れる</desc><defs><marker id="a302563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a30087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a30b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a305c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a30e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="770" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問30  リスクの回避</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">対応の違い：活動をやめる／影響を減らす／負担を移す／受け入れる</text><rect x="35" y="135" width="345" height="205" rx="10" fill="#edf4fb" stroke="#2563a6" stroke-width="2"/><text x="207" y="183" font-size="29" fill="#2563a6" text-anchor="middle" font-weight="400">ア：低減</text><text x="207" y="243" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">冗長化する</text><text x="207" y="275" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">故障の影響を減らす</text><rect x="420" y="135" width="345" height="205" rx="10" fill="#edf4fb" stroke="#2563a6" stroke-width="2"/><text x="592" y="183" font-size="29" fill="#2563a6" text-anchor="middle" font-weight="400">イ：移転</text><text x="592" y="243" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">保険に入る</text><text x="592" y="275" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">損失の負担を移す</text><rect x="35" y="380" width="345" height="205" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="207" y="428" font-size="29" fill="#087f68" text-anchor="middle" font-weight="400">ウ：回避</text><text x="207" y="488" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">サービスをやめる</text><text x="207" y="520" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">原因の活動を中止</text><rect x="420" y="380" width="345" height="205" rx="10" fill="#edf4fb" stroke="#2563a6" stroke-width="2"/><text x="592" y="428" font-size="29" fill="#2563a6" text-anchor="middle" font-weight="400">エ：受容</text><text x="592" y="488" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">小さいリスクを認識し</text><text x="592" y="520" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">特別な対処をしない</text><rect x="24" y="701" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="734.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">本問は「回避」。リスクを生むサービスを中止する選択肢ウ</text></g></svg>