<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 710" role="img" aria-labelledby="t51 d51"><title id="t51">問51 バランススコアカードの学習と成長の図解</title><desc id="d51">学習と成長は、財務成果を支える「人材・能力」の土台</desc><defs><marker id="a512563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a51087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a51b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a515c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a51e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="710" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問51  バランススコアカードの学習と成長</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">学習と成長は、財務成果を支える「人材・能力」の土台</text><rect x="45" y="120" width="170" height="80" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="130.0" y="168.05" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">学習と成長</text><rect x="255" y="120" width="510" height="80" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="510.0" y="168.4" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">技術研修 → 製品開発力を高める</text><line x1="510" y1="200" x2="510" y2="230" stroke="#087f68" stroke-width="3" marker-end="url(#a51087f68)" /><rect x="45" y="235" width="170" height="80" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="130.0" y="283.05" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">内部プロセス</text><rect x="255" y="235" width="510" height="80" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="510.0" y="283.4" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">開発の品質・効率を改善</text><line x1="510" y1="315" x2="510" y2="345" stroke="#087f68" stroke-width="3" marker-end="url(#a51087f68)" /><rect x="45" y="350" width="170" height="80" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="130.0" y="398.05" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">顧客</text><rect x="255" y="350" width="510" height="80" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="510.0" y="398.4" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">よい製品で顧客満足を高める</text><line x1="510" y1="430" x2="510" y2="460" stroke="#087f68" stroke-width="3" marker-end="url(#a51087f68)" /><rect x="45" y="465" width="170" height="80" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="130.0" y="513.05" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">財務</text><rect x="255" y="465" width="510" height="80" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="510.0" y="513.4" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">売上・利益の向上へつなげる</text><rect x="24" y="641" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="674.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">「技術研修の受講時間」は、学習と成長の視点の指標（ウ）</text></g></svg>