<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="t22 d22"><title id="t22">問22 ロックの両立性の図解</title><desc id="d22">同じ資源を読む二人は両立。更新する人は、読取り中には入れない</desc><defs><marker id="a222563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a22087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a22b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a225c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a22e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="680" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問22  ロックの両立性</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">同じ資源を読む二人は両立。更新する人は、読取り中には入れない</text><text x="40" y="127" font-size="24" fill="#16324f" text-anchor="start" font-weight="700">T1が共有ロック（読取り）を保持中</text><rect x="280" y="170" width="240" height="140" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="231.8" font-size="28" fill="#16324f" text-anchor="middle" font-weight="400">資源</text><text x="400.0" y="267.8" font-size="28" fill="#16324f" text-anchor="middle" font-weight="400">T1が読取り中</text><rect x="30" y="355" width="285" height="90" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="172.5" y="392.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">T2：共有ロック</text><text x="172.5" y="425.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">読取りを要求</text><rect x="485" y="355" width="285" height="90" rx="10" fill="#fbe8eb" stroke="#b7c9dc" stroke-width="2"/><text x="627.5" y="392.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">T2：専有ロック</text><text x="627.5" y="425.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">更新を要求</text><line x1="170" y1="355" x2="300" y2="310" stroke="#087f68" stroke-width="4" marker-end="url(#a22087f68)" /><line x1="630" y1="355" x2="500" y2="310" stroke="#b33b44" stroke-width="4" stroke-dasharray="7 5"/><circle cx="240" cy="330" r="23" fill="#dcf3e9" stroke="#087f68" stroke-width="3"/><text x="240" y="337.7" font-size="22" fill="#087f68" text-anchor="middle" font-weight="400">○</text><circle cx="565" cy="330" r="23" fill="#fbe8eb" stroke="#b33b44" stroke-width="3"/><text x="565" y="337.7" font-size="22" fill="#b33b44" text-anchor="middle" font-weight="400">×</text><text x="170" y="487" font-size="25" fill="#087f68" text-anchor="middle" font-weight="400">同時に読める</text><text x="630" y="487" font-size="23" fill="#b33b44" text-anchor="middle" font-weight="400">読取りが終わるまで待つ</text><rect x="90" y="520" width="620" height="65" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="559.85" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">T1が専有ロックなら、他の共有・専有は両方待つ</text><rect x="24" y="611" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="644.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">T1共有中 → T2の共有は可、専有は不可（イ）</text></g></svg>