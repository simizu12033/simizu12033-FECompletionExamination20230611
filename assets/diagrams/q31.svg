<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="t31 d31"><title id="t31">問31 IDSの図解</title><desc id="d31">IDSは監視して検知・通知。通信を直接遮断するIPSと区別</desc><defs><marker id="a312563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a31087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a31b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a315c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a31e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="620" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問31  IDS</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">IDSは監視して検知・通知。通信を直接遮断するIPSと区別</text><rect x="25" y="140" width="165" height="70" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="107.5" y="183.75" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">外部通信</text><rect x="325" y="140" width="170" height="70" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="410.0" y="182.7" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">ネットワーク</text><rect x="620" y="140" width="155" height="70" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="697.5" y="184.45" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">端末</text><line x1="190" y1="175" x2="325" y2="175" stroke="#2563a6" stroke-width="3" marker-end="url(#a312563a6)" /><line x1="495" y1="175" x2="620" y2="175" stroke="#2563a6" stroke-width="3" marker-end="url(#a312563a6)" /><rect x="290" y="325" width="250" height="90" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="415.0" y="362.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">IDS</text><text x="415.0" y="395.25" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">攻撃の兆候を検知</text><line x1="410" y1="210" x2="410" y2="325" stroke="#2563a6" stroke-width="3" marker-end="url(#a312563a6)" /><text x="450" y="278" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">監視対象の情報</text><rect x="595" y="340" width="180" height="80" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="685.0" y="389.45" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">管理者</text><line x1="540" y1="375" x2="595" y2="375" stroke="#b33b44" stroke-width="3" marker-end="url(#a31b33b44)" /><text x="667" y="318" font-size="22" fill="#b33b44" text-anchor="middle" font-weight="400">警告・通知</text><text x="400" y="494" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">通信を監視 → 不審な侵入・攻撃を見つける → 通知</text><rect x="24" y="551" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="584.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">サーバやネットワークを監視し、侵入や攻撃を検知する＝IDS（ウ）</text></g></svg>