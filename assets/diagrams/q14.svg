0">bを加える</text><line x1="605" y1="175" x2="605" y2="230" stroke="#2563a6" stroke-width="3" marker-end="url(#a142563a6)" /><text x="660" y="215" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">gを引く</text><rect x="30" y="240" width="330" height="80" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="195.0" y="289.45" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">w2＝b＋c÷d</text><rect x="440" y="240" width="330" height="80" rx="10" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="605.0" y="289.45" font-size="27" fill="#16324f" text-anchor="middle" font-weight="400">w4＝e÷f−g</text><line x1="195" y1="320" x2="335" y2="410" stroke="#2563a6" stroke-width="3" marker-end="url(#a142563a6)" /><line x1="605" y1="320" x2="465" y2="410" stroke="#2563a6" stroke-width="3" marker-end="url(#a142563a6)" /><rect x="270" y="425" width="260" height="65" rx="10" fill="#edf4fb" stroke="#b7c9dc" stroke-width="2"/><text x="400.0" y="467.3" font-size="28" fill="#16324f" text-anchor="middle" font-weight="400">x＝w2 × w4</text><text x="400" y="554" font-size="31" fill="#087f68" text-anchor="middle" font-weight="400">(b＋c÷d) × (e÷f−g)</text><rect x="24" y="621" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="654.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">w2とw4を丸ごと乗算するので、両側に括弧が必要（エ）</text></g></svg>