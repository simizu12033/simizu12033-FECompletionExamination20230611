<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 740" role="img" aria-labelledby="t57 d57"><title id="t57">問57 定量発注の数量調整の図解</title><desc id="d57">消費予測が減り、納品直前の在庫がSからXへ増えるケース</desc><defs><marker id="a572563a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a6"/></marker><marker id="a57087f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker><marker id="a57b33b44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b33b44"/></marker><marker id="a575c7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c7185"/></marker><marker id="a57e89536" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e89536"/></marker></defs><rect width="800" height="740" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="24" y="42" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">問57  定量発注の数量調整</text><text x="24" y="76" font-size="20" fill="#5c7185" text-anchor="start" font-weight="400">消費予測が減り、納品直前の在庫がSからXへ増えるケース</text><line x1="95" y1="145" x2="625" y2="145" stroke="#5c7185" stroke-width="2" /><text x="640" y="153" font-size="21" fill="#5c7185" text-anchor="start" font-weight="400">最大在庫 M</text><line x1="95" y1="270" x2="625" y2="270" stroke="#5c7185" stroke-width="2" /><text x="640" y="278" font-size="21" fill="#5c7185" text-anchor="start" font-weight="400">発注点 K</text><line x1="95" y1="340" x2="625" y2="340" stroke="#087f68" stroke-width="2" stroke-dasharray="7 5"/><text x="640" y="348" font-size="21" fill="#087f68" text-anchor="start" font-weight="400">変更後 X</text><line x1="95" y1="440" x2="625" y2="440" stroke="#5c7185" stroke-width="2" /><text x="640" y="448" font-size="21" fill="#5c7185" text-anchor="start" font-weight="400">当初 S</text><line x1="95" y1="500" x2="625" y2="500" stroke="#5c7185" stroke-width="2" marker-end="url(#a575c7185)" /><text x="610" y="535" font-size="20" fill="#16324f" text-anchor="end" font-weight="400">時間</text><line x1="95" y1="500" x2="95" y2="110" stroke="#5c7185" stroke-width="2" marker-end="url(#a575c7185)" /><text x="35" y="113" font-size="21" fill="#16324f" text-anchor="start" font-weight="400">在庫量</text><path d="M95 145L265 270L485 440" fill="none" stroke="#2563a6" stroke-width="4" /><path d="M265 270L485 340" fill="none" stroke="#087f68" stroke-width="5" /><line x1="265" y1="270" x2="265" y2="500" stroke="#5c7185" stroke-width="2" stroke-dasharray="7 5"/><line x1="485" y1="130" x2="485" y2="500" stroke="#5c7185" stroke-width="2" stroke-dasharray="7 5"/><text x="265" y="539" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">発注a</text><text x="485" y="539" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">納品a</text><line x1="485" y1="340" x2="485" y2="145" stroke="#087f68" stroke-width="5" marker-end="url(#a57087f68)" /><text x="380" y="215" font-size="21" fill="#087f68" text-anchor="middle" font-weight="400">調整後の発注量</text><text x="380" y="247" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">E−(X−S)</text><line x1="550" y1="340" x2="550" y2="440" stroke="#b33b44" stroke-width="4" /><text x="557" y="397" font-size="22" fill="#b33b44" text-anchor="start" font-weight="400">X−S</text><text x="400" y="599" font-size="25" fill="#16324f" text-anchor="middle" font-weight="400">もとの E＝M−S → 新しい E＝M−X</text><rect x="24" y="671" width="752" height="51" rx="10" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400.0" y="704.55" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">在庫が余る分X−Sを取り消せば、納品後に最大在庫を超えない（エ）</text></g></svg>