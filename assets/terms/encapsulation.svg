<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>カプセル化：内部状態を公開操作からだけ扱う</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker></defs><rect width="800" height="450" fill="#f7fbfc"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#16324f"><text x="400" y="45" text-anchor="middle" font-size="27">カプセル化：内部データを直接変更させない</text><rect x="255" y="105" width="510" height="265" rx="15" fill="#edf4fb" stroke="#2563a6"/><text x="510" y="143" text-anchor="middle" font-size="25">口座オブジェクト</text><rect x="20" y="195" width="200" height="100" rx="12" fill="#dcf3e9" stroke="#087f68"/><text x="120.0" y="235" text-anchor="middle" font-size="24">利用者</text><text x="120.0" y="270" text-anchor="middle" font-size="24">入金額100</text><rect x="280" y="195" width="205" height="100" rx="12" fill="#dcf3e9" stroke="#087f68"/><text x="382.5" y="235" text-anchor="middle" font-size="24">公開操作：入金</text><text x="382.5" y="270" text-anchor="middle" font-size="24">条件を確認</text><rect x="535" y="195" width="205" height="100" rx="12" fill="#dcf3e9" stroke="#087f68"/><text x="637.5" y="235" text-anchor="middle" font-size="24">内部の残高</text><text x="637.5" y="270" text-anchor="middle" font-size="24">直接アクセス不可</text><path d="M220 245L280 245" fill="none" stroke="#087f68" stroke-width="3" marker-end="url(#arrow)"/><path d="M485 245L535 245" fill="none" stroke="#087f68" stroke-width="3" marker-end="url(#arrow)"/><text x="400" y="418" text-anchor="middle" font-size="22">公開された操作を通じて、内部状態を安全に更新する</text></g></svg>