<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>オーバーライド：継承したメソッドの再定義</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker></defs><rect width="800" height="450" fill="#f7fbfc"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#16324f"><text x="400" y="45" text-anchor="middle" font-size="27">オーバーライド：同じメソッドを子で再定義</text><rect x="230" y="85" width="340" height="110" rx="12" fill="#dcf3e9" stroke="#087f68"/><text x="400.0" y="125" text-anchor="middle" font-size="24">親：動物クラス</text><text x="400.0" y="160" text-anchor="middle" font-size="24">鳴く() → 一般的な動作</text><path d="M400 195L400 245" fill="none" stroke="#087f68" stroke-width="3" marker-end="url(#arrow)"/><rect x="230" y="250" width="340" height="110" rx="12" fill="#dcf3e9" stroke="#087f68"/><text x="400.0" y="290" text-anchor="middle" font-size="24">子：犬クラス</text><text x="400.0" y="325" text-anchor="middle" font-size="24">鳴く() →「ワン」</text><text x="400" y="412" text-anchor="middle" font-size="22">名前・引数が対応するメソッドの実装を置き換える</text></g></svg>