<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>多相性：同じ呼出しが対象に応じて振る舞う</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f68"/></marker></defs><rect width="800" height="450" fill="#f7fbfc"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#16324f"><text x="400" y="45" text-anchor="middle" font-size="27">多相性：呼出しは同じ、実体で動作が変わる</text><rect x="230" y="85" width="340" height="95" rx="12" fill="#dcf3e9" stroke="#087f68"/><text x="400.0" y="125" text-anchor="middle" font-size="24">動物として扱う</text><text x="400.0" y="160" text-anchor="middle" font-size="24">鳴く()を呼ぶ</text><path d="M330 180L185 260" fill="none" stroke="#087f68" stroke-width="3" marker-end="url(#arrow)"/><path d="M470 180L615 260" fill="none" stroke="#087f68" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="265" width="280" height="100" rx="12" fill="#dcf3e9" stroke="#087f68"/><text x="185.0" y="305" text-anchor="middle" font-size="24">実体が犬</text><text x="185.0" y="340" text-anchor="middle" font-size="24">「ワン」</text><rect x="475" y="265" width="280" height="100" rx="12" fill="#dcf3e9" stroke="#087f68"/><text x="615.0" y="305" text-anchor="middle" font-size="24">実体が猫</text><text x="615.0" y="340" text-anchor="middle" font-size="24">「ニャー」</text><text x="400" y="418" text-anchor="middle" font-size="24">対象の型に応じた実装が選ばれる</text></g></svg>